services:
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:5000  
    depends_on:
      - backend
    networks:
      - expense-network

  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/expense-tracker
      - PORT=5000
    depends_on:
      - mongodb
    networks:
      - expense-network

  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - expense-network

volumes:
  mongo-data:

networks:
  expense-network:
    driver: bridge