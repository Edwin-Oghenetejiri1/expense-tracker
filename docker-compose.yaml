services:
  frontend:
    build:
      context: ./frontend
      args:
        - REACT_APP_API_URL=${API_URL}
    ports:
      - "${FRONTEND_PORT}:80"
    depends_on:
      - backend
    networks:
      - expense-network

  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=${MONGO_URI}
      - PORT=${BACKEND_PORT}
    depends_on:
      - mongodb
    networks:
      - expense-network

  mongodb:
    image: mongo:latest
    ports:
      - "${MONGO_PORT}:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - expense-network

volumes:
  mongo-data:

networks:
  expense-network:
    driver: bridge